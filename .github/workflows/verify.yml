name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Regression, architecture and release checks
        shell: pwsh
        run: ./gradlew.bat verifyAll --no-daemon --no-problems-report --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            core/build/reports/tests/
            local/build/reports/tests/
            build/reports/release-verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Writable-Book-Wiki
          path: neoforge/build/libs/*NeoForge-1.21.1.jar

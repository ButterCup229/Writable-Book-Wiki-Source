pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven {
            name = 'NeoForged Releases'
            url = uri('https://maven.neoforged.net/releases')
        }
    }
}

rootProject.name = 'editbook-wiki'

include 'wiki-core'
include 'wiki-plugin-api'
include 'wiki-local'
include 'wiki-neoforge'

pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        maven {
            name = 'NeoForged Releases'
            url = uri('https://maven.neoforged.net/releases')
        }
    }
}

rootProject.name = 'Writable Book Wiki'

include 'core'
include 'plugin-api'
include 'local'
include 'neoforge'
